<style>
:root{--paper:#EDF2F7;--ink:#0D1B2A;--slate:#1A2E44;--sky:#0077B6;--muted:#546E7A;--line:#C8D8E8;--sun:#E8A317}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip}body{font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;line-height:1.6;word-break:keep-all;overflow-x:clip}
.box{max-width:560px;width:100%}
.co{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:14px}
h1 em{font-style:normal;background:linear-gradient(var(--sun),var(--sun)) no-repeat 0 94%/100% .08em}
p{font-size:16px;color:var(--slate);margin-top:16px;max-width:460px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:6px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style>
<script src="/sr-website/assets/js/site.js"></script>
</head>
<body>
<main class="box">
  <div class="co">주식회사 에스알</div>
  <h1>찾으시는 페이지가<br><em>없습니다.</em></h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같습니다. 아래에서 원하는 곳으로 이동해 주세요.</p>
  <div class="links">
    <a class="btn primary" href="/sr-website/">홈으로</a>
    <a class="btn" href="/sr-website/analysis.html">경제성 분석</a>
    <a class="btn" href="/sr-website/cases.html">프로젝트</a>
    <a class="btn" href="/sr-website/contact.html">문의하기</a>
  </div>
  <div class="foot">전화 063-544-8142 · 평일 09:00~18:00</div>
</main>

</html>
