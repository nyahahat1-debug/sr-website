<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 · 주식회사 에스알</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" integrity="sha384-GIdEBaqGN9mNkDkMkzMHW8EKUqtpPIe/sLj1X7DIrnc9uPtLROJgmuDlh+3rBw0j" crossorigin="anonymous">
<style>
:root{--paper:#EDF2F7;--ink:#0D1B2A;--slate:#1A2E44;--sky:#0077B6;--muted:#546E7A;--line:#C8D8E8;--sun:#E8A317}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:clip}body{font-family:'Pretendard Variable','Pretendard',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;line-height:1.6;word-break:keep-all;overflow-x:clip}
.box{max-width:560px;width:100%}
.co{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:14px}
h1 em{font-style:normal;background:linear-gradient(var(--sun),var(--sun)) no-repeat 0 94%/100% .08em}
p{font-size:16px;color:var(--slate);margin-top:16px;max-width:460px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:6px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn.primary{background:var(--sky);border-color:var(--sky);color:#fff}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* ═══ 모바일 최적화 v3 · 2026-10-21 ═══
   17개 화면(280~960px: 1세대 폴드 커버 280, iPhone SE 320·375, Z Fold 커버 344, 갤럭시 360, Z Flip, iPhone 15 393, S24 Ultra 412,
   Pro Max 440, Surface Duo 540, Z Fold 펼침 690, iPad mini 768, Pixel Fold 841, 가로 모드 4종) 자동 점검(tools/mobile_audit.js) 결과 반영.
   원칙: 토큰·기능 유지. 좁은 화면의 겹침·잘림·자동 확대를 막고 터치 영역을 확보한다. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:only light}   /* iOS 가로 모드 글자 자동 확대 금지 · 브라우저 강제 다크모드(삼성 인터넷·크롬 자동 다크) 금지 */
@media(max-width:480px){.nav>.btn{white-space:nowrap;padding:8px 10px;font-size:12px}}   /* 상단 버튼이 두 줄로 꺾여 로고를 덮던 문제 */
@media(max-width:360px){.logo-img{height:26px}}
@media(max-width:300px){.nav>.btn{display:none}}   /* 1세대 폴드 커버(280px): 메뉴 안의 '문의하기'로 대신 */
@media(max-width:960px){.foot-bottom a{display:inline-block;padding:8px 0;margin:-8px 0}}   /* 터치 영역 */
</style>
<script src="/sr-website/assets/js/site.js"></script>
</head>
<body>
<main class="box">
  <div class="co">주식회사 에스알</div>
  <h1>찾으시는 페이지가<br><em>없습니다.</em></h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같습니다. 아래에서 원하는 곳으로 이동해 주세요.</p>
  <div class="links">
    <a class="btn primary" href="/sr-website/">홈으로</a>
    <a class="btn" href="/sr-website/analysis.html">경제성 분석</a>
    <a class="btn" href="/sr-website/cases.html">프로젝트</a>
    <a class="btn" href="/sr-website/contact.html">문의하기</a>
  </div>
  <div class="foot">전화 063-544-8142 · 평일 09:00~18:00</div>
</main>
</body>
</html>
