name: 전력 시세 수집 (SMP·REC)

# 매일 06:30·18:30 KST (= 21:30·09:30 UTC) 에 공공데이터포털에서 SMP·REC 를 받아 assets/data/market.json 갱신
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 시세 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/market_collect.py --out assets/data/market.json
      - name: 변경분 커밋
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add assets/data/market.json
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "시세 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')" && git push; fi
