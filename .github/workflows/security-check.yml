name: 보안 점검

# 푸시·PR 마다 tools/security_check.py 실행 — 인라인 스크립트·CSP 메타·SRI·비밀값·워크플로 고정·시세 데이터 스키마 확인
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 점검 실행
        run: python tools/security_check.py --ci
