name: 보안 점검

# 푸시·PR 마다 tools/security_check.py 실행 — 인라인 스크립트·CSP 메타·SRI·비밀값·워크플로 고정·시세 데이터 스키마 확인
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 점검 실행
        run: python tools/security_check.py --ci
