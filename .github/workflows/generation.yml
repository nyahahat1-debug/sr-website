name: 발전 현황 수집 (HI SMART)

# 낮 시간(06~20시 KST) 매시 정각에 HI SMART 모니터링에서 에스알 현장 발전량을 받아 assets/data/generation.json 갱신
# 자격증명은 저장소 비밀값 HS3_USER_ID / HS3_PASSWORD 로만 전달. 검증 실패 시 파일을 쓰지 않는다(커밋 없음).
on:
  schedule:
    - cron: '0 21-23 * * *'   # 06~08시 KST
    - cron: '0 0-11 * * *'    # 09~20시 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generation-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 발전 현황 수집 (스키마 검증 포함)
        env:
          HS3_USER_ID: ${{ secrets.HS3_USER_ID }}
          HS3_PASSWORD: ${{ secrets.HS3_PASSWORD }}
        run: python tools/generation_collect.py --out assets/data/generation.json
      - name: 효성 전주공장 발전량 수집 (Q.HUB, 비밀값 없으면 건너뜀)
        env:
          QHUB_USER_ID: ${{ secrets.QHUB_USER_ID }}
          QHUB_PASSWORD: ${{ secrets.QHUB_PASSWORD }}
        run: |
          if [ -z "$QHUB_USER_ID" ]; then echo "QHUB 비밀값 없음 — 건너뜀"; echo '{"ok":false,"stage":"secrets","error":"QHUB_USER_ID/QHUB_PASSWORD 비밀값 없음"}' > assets/data/qhub-status.json; exit 0; fi
          python tools/qhub_collect.py --out assets/data/hyosung-generation.json || echo "Q.HUB 수집 실패 — 이전 파일 유지"
          echo "### Q.HUB 수집 상태" >> "$GITHUB_STEP_SUMMARY"; cat assets/data/qhub-status.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: 결과 재검증
        run: python tools/security_check.py --ci
      - name: 변경분 커밋 (최신 main 위에 결과 파일만 얹어서 — 다른 실행과 겹쳐도 충돌 없음)
        run: |
          git config user.name "generation-bot"
          git config user.email "generation-bot@users.noreply.github.com"
          mkdir -p /tmp/out
          for f in assets/data/generation.json assets/data/hyosung-generation.json assets/data/qhub-status.json; do [ -f "$f" ] && cp "$f" /tmp/out/ || true; done
          git fetch origin main && git reset --hard origin/main
          for f in assets/data/generation.json assets/data/hyosung-generation.json assets/data/qhub-status.json; do b=$(basename "$f"); [ -f "/tmp/out/$b" ] && cp "/tmp/out/$b" "$f" || true; done
          git add assets/data/generation.json assets/data/hyosung-generation.json assets/data/qhub-status.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "발전 현황 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
